<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Shelters - SafeRoute</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/map.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="/"><span class="logo">🛡️</span><span class="brand-name">SafeRoute</span></a>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="/">Home</a></li>
                <li><a href="/dashboard.html">Live Map</a></li>
                <li><a href="/shelters.html" class="active">Shelters</a></li>
                <li><a href="/route.html">Safe Route</a></li>
                <li><a href="/report.html">Report</a></li>
                <li id="profileNavItem" style="display:none"><a href="/profile.html">Profile</a></li>
                <li id="adminNavItem" style="display:none"><a href="/admin.html">Admin</a></li>
                <li id="loginNavItem"><a href="/login.html" class="btn-nav">Login</a></li>
                <li id="logoutNavItem" style="display:none"><a href="#" onclick="logout()" class="btn-nav btn-logout">Logout</a></li>
            </ul>
            <div class="hamburger" onclick="toggleNav()"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h1>🏠 Emergency Shelters</h1>
            <p class="text-muted">Find nearby emergency shelters with capacity and facility information</p>
        </div>

        <div style="display:flex; gap:.75rem; margin-bottom:1.5rem; flex-wrap:wrap; align-items:center;">
            <button class="btn btn-primary btn-sm" onclick="loadShelters('open')">🟢 Open Shelters</button>
            <button class="btn btn-outline btn-sm" onclick="loadShelters()">📋 All Shelters</button>
            <button class="btn btn-success btn-sm" onclick="findNearbyShelters()">📍 Near Me</button>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; align-items:start;">
            <!-- Map -->
            <div class="card" style="padding:.5rem">
                <div id="map" style="height:500px; border-radius:8px;"></div>
            </div>

            <!-- Shelter List -->
            <div>
                <div id="shelterCount" class="text-muted" style="margin-bottom:.75rem; font-size:.9rem">Loading shelters...</div>
                <div id="shelterList">
                    <div class="loading-spinner">Loading shelters...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        // Init map
        const shelterMap = L.map('map').setView([31.22, 75.77], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
        }).addTo(shelterMap);

        let markers = [];

        // Load shelters on page load
        loadShelters('open');

        async function loadShelters(status) {
            const url = status ? `/shelters?status=${status}` : '/shelters';
            try {
                const data = await apiFetch(url);
                if (data?.success) {
                    renderShelters(data.shelters || []);
                }
            } catch (err) {
                document.getElementById('shelterList').innerHTML = '<p class="no-data">Failed to load shelters</p>';
            }
        }

        async function findNearbyShelters() {
            if (!navigator.geolocation) {
                showToast('Geolocation not supported', 'error');
                return;
            }

            showToast('Detecting location...', 'info');
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    try {
                        const data = await apiFetch(`/shelters/nearby?longitude=${pos.coords.longitude}&latitude=${pos.coords.latitude}&maxDistance=10000`);
                        if (data?.success) {
                            renderShelters(data.shelters || []);
                            shelterMap.setView([pos.coords.latitude, pos.coords.longitude], 13);
                            // Add user marker
                            L.circleMarker([pos.coords.latitude, pos.coords.longitude], {
                                radius: 8, fillColor: '#2563eb', color: '#fff', weight: 2, fillOpacity: 1
                            }).addTo(shelterMap).bindPopup('📍 You are here').openPopup();
                        }
                    } catch (err) {
                        showToast('Failed to find nearby shelters', 'error');
                    }
                },
                () => showToast('Could not detect location', 'error')
            );
        }

        function renderShelters(shelters) {
            // Clear old markers
            markers.forEach(m => shelterMap.removeLayer(m));
            markers = [];

            document.getElementById('shelterCount').textContent = `Found ${shelters.length} shelter(s)`;

            const list = document.getElementById('shelterList');
            if (shelters.length === 0) {
                list.innerHTML = '<p class="no-data">No shelters found</p>';
                return;
            }

            list.innerHTML = shelters.map(s => {
                const occupancy = s.currentOccupancy || 0;
                const pct = s.capacity > 0 ? Math.round((occupancy / s.capacity) * 100) : 0;
                const available = Math.max(0, s.capacity - occupancy);

                return `
                    <div class="card" style="cursor:pointer; margin-bottom:.75rem" onclick="focusShelter(${s.location.coordinates[1]}, ${s.location.coordinates[0]})">
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <div>
                                <h4 style="margin-bottom:.25rem">🏠 ${escapeHtml(s.name)}</h4>
                                <p class="text-muted" style="font-size:.82rem">📍 ${escapeHtml(s.address)}</p>
                            </div>
                            <span class="severity-badge ${s.status === 'open' ? 'severity-low' : s.status === 'full' ? 'severity-high' : 'severity-medium'}">
                                ${s.status}
                            </span>
                        </div>
                        <div style="margin-top:.5rem">
                            <div style="display:flex; justify-content:space-between; font-size:.82rem; margin-bottom:.25rem">
                                <span>Capacity: ${occupancy}/${s.capacity}</span>
                                <span>${available} spots available</span>
                            </div>
                            <div style="width:100%; height:6px; background:#e2e8f0; border-radius:3px; overflow:hidden">
                                <div style="height:100%; width:${pct}%; background:${pct > 80 ? '#ef4444' : pct > 50 ? '#f59e0b' : '#22c55e'}; border-radius:3px"></div>
                            </div>
                        </div>
                        ${s.facilities?.length ? `<p style="font-size:.78rem; color:var(--gray); margin-top:.35rem">🏗️ ${s.facilities.join(', ')}</p>` : ''}
                        ${s.contact?.phone ? `<p style="font-size:.78rem; margin-top:.25rem">📞 ${s.contact.phone}</p>` : ''}
                    </div>
                `;
            }).join('');

            // Add markers to map
            shelters.forEach(s => {
                if (s.location?.coordinates) {
                    const coords = s.location.coordinates;
                    const m = L.circleMarker([coords[1], coords[0]], {
                        radius: 10, fillColor: s.status === 'open' ? '#22c55e' : '#ef4444',
                        color: '#fff', weight: 2, fillOpacity: 0.85
                    }).addTo(shelterMap);

                    m.bindPopup(`<div class="popup-content"><h4>🏠 ${escapeHtml(s.name)}</h4><p>${escapeHtml(s.address)}</p><p>Status: <strong>${s.status}</strong></p><p>Capacity: ${s.currentOccupancy || 0}/${s.capacity}</p></div>`);
                    markers.push(m);
                }
            });

            // Fit map
            if (markers.length > 0) {
                const group = L.featureGroup(markers);
                shelterMap.fitBounds(group.getBounds().pad(0.15));
            }
        }

        function focusShelter(lat, lng) {
            shelterMap.setView([lat, lng], 16);
            markers.forEach(m => {
                const ll = m.getLatLng();
                if (Math.abs(ll.lat - lat) < 0.0001 && Math.abs(ll.lng - lng) < 0.0001) {
                    m.openPopup();
                }
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }
    </script>
</body>
</html>
